<!DOCTYPE html>
<html>
<head>
    <title>Icon Checker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .icon-container { margin-bottom: 20px; }
        img { border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Icon Size Checker</h1>
    
    <div class="icon-container">
        <h2>icon-192x192.png</h2>
        <img src="../icon-192x192.png" id="icon192" alt="192x192 Icon">
        <p>Actual dimensions: <span id="size192"></span></p>
    </div>
    
    <div class="icon-container">
        <h2>icon-512x512.png</h2>
        <img src="../icon-512x512.png" id="icon512" alt="512x512 Icon">
        <p>Actual dimensions: <span id="size512"></span></p>
    </div>

    <script>
        window.onload = function() {
            const icon192 = document.getElementById('icon192');
            const icon512 = document.getElementById('icon512');
            const size192 = document.getElementById('size192');
            const size512 = document.getElementById('size512');
            
            icon192.onload = function() {
                size192.textContent = `${icon192.naturalWidth}x${icon192.naturalHeight}`;
            };
            
            icon512.onload = function() {
                size512.textContent = `${icon512.naturalWidth}x${icon512.naturalHeight}`;
            };
        };
    </script>
</body>
</html>
